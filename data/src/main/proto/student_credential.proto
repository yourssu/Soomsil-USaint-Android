syntax = "proto3";

option java_package = "com.yourssu.soomsil.usaint.proto";
option java_multiple_files = true;

message StudentCredentialProto {
  bool isLoggedIn = 1;        // 로그인 여부
  string id = 2;              // 학번
  string password = 3;        // 유세인트 비밀번호
  //  string sToken = 3;
  //  int64 token_issued_at = 4;  // 토큰 발행 시간 (Unix timestamp)
}