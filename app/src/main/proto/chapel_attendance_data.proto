syntax = "proto3";

option java_package = "com.yourssu.soomsil.usaint.proto";
option java_multiple_files = true;

message ChapelAttendanceDataProto {
  int64 division = 1;        // 분반
  string classDate = 2;              // 수업일자
  string category = 3;              // 강의구분
  string instructor = 4;              // 강사명
  string instructorDepartment = 5;    // 강사소속
  string title = 6;              // 강의제목
  string attendance = 7; // 출결
  string result = 8; // 평가내용
  string note = 9;   // 비고
}